name: Unit Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ '22.x', '24.x', '26.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # npm install builds the module from source when no prebuild exists,
      # which is always the case on a fresh CI checkout
      - name: Install
        run: npm install

      - name: Run unit tests
        run: npm test

  # The Linux x64 prebuild ships in both libc flavors; make sure the module
  # builds and passes the test suite against musl as well.
  test-musl:
    name: node 24 / linux musl (Alpine)
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bash: not in the node:alpine image, but required by the install script
      - name: Install build tools (bash, cmake)
        run: apk add --no-cache bash cmake

      - name: Install
        run: npm install

      - name: Run unit tests
        run: npm test
