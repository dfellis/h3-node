on:
  push:
    tags:
      - 'v*'

name: Create Release

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (prebuild jobs upload their artifacts to it)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # One N-API prebuild per platform (os-arch-libc). N-API is ABI-stable
  # across the supported Node versions (22/24/26), so the Node version does
  # not need to be part of the build matrix.
  prebuild:
    name: prebuild ${{ matrix.artifact }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64, glibc — native
          - runner: ubuntu-latest
            kind: native
            artifact: h3-node-linux-x64-glibc.tar.gz
          # Linux x86-64, musl — Alpine container
          # (node:alpine ships only node and npm; the build needs the rest)
          - runner: ubuntu-latest
            kind: docker
            image: node:24-alpine
            install: apk add --no-cache bash git cmake make g++ python3 && npm install
            artifact: h3-node-linux-x64-musl.tar.gz
          # Linux arm64, glibc — QEMU-emulated container
          - runner: ubuntu-latest
            kind: docker
            platform: linux/arm64
            image: node:24
            install: apt-get update -qq && apt-get install -y -qq cmake && npm install
            artifact: h3-node-linux-arm64-glibc.tar.gz
          # Linux arm64, musl — QEMU-emulated container
          - runner: ubuntu-latest
            kind: docker
            platform: linux/arm64
            image: node:24-alpine
            install: apk add --no-cache bash git cmake make g++ python3 && npm install
            artifact: h3-node-linux-arm64-musl.tar.gz
          # macOS arm64 — native (Apple has stopped shipping x86-64 Macs)
          - runner: macos-latest
            kind: native
            artifact: h3-node-darwin-arm64.tar.gz
          # Windows x86-64 — native
          - runner: windows-latest
            kind: native
            zip: true
            artifact: h3-node-win32-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for emulated arm64 containers)
        if: ${{ matrix.platform }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Node.js 24
        if: ${{ matrix.kind == 'native' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build prebuild (native)
        if: ${{ matrix.kind == 'native' }}
        # npm install runs the build (and prebuildify) via the install script
        run: npm install

      - name: Build prebuild (container)
        if: ${{ matrix.kind == 'docker' }}
        shell: bash
        # Build in a container-local copy so the host workspace (and its
        # file ownership) stays clean; only prebuilds/ is copied back.
        run: |
          # -u root: node:alpine images default to the unprivileged `node`
          # user, which cannot install cmake. sh (not bash): the alpine
          # images have no bash until the install command adds it.
          docker run --rm -u root \
            --platform "${{ matrix.platform || 'linux/amd64' }}" \
            -v "$PWD":/src -w /src \
            "${{ matrix.image }}" \
            sh -c "set -e; mkdir -p /work; cp -a /src/. /work/; cd /work; ${{ matrix.install }}; mkdir -p /src/prebuilds; cp -a /work/prebuilds/. /src/prebuilds/"

      - name: Package artifact (tar.gz)
        if: ${{ !matrix.zip }}
        shell: bash
        # The archive contains the contents of prebuilds/ (e.g. linux-x64/...),
        # matching what `prebuildify-ci download` (see scripts/fetch-artifacts.sh)
        # extracts into ./prebuilds for publishing.
        run: tar -czf "${{ matrix.artifact }}" -C prebuilds .

      - name: Package artifact (zip)
        if: ${{ matrix.zip }}
        shell: pwsh
        run: Compress-Archive -Path "prebuilds/*" -DestinationPath "${{ matrix.artifact }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
